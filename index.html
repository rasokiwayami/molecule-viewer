<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04060c" />
    <meta name="description" content="名前を入れると分子が立体で現れ、手でつまんで回せます。" />
    <title>てのひら分子</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2304060c'/%3E%3Ccircle cx='14' cy='24' r='7' fill='%23d7ff5e'/%3E%3Ccircle cx='27' cy='14' r='5' fill='%23fff'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="stage"></div>
    <div id="watermark" aria-hidden="true"></div>
    <div id="atom-label" hidden></div>
    <div id="reticles" aria-hidden="true"></div>

    <header>
      <a class="wordmark" href="./">てのひら分子</a>
      <nav>
        <button id="hands-toggle" class="primary" aria-pressed="false">
          <span class="pulse" aria-hidden="true"></span><span id="hands-text">手で動かす</span>
        </button>
        <button id="qr-open" class="icon" aria-label="スマホで開く">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.2" />
            <rect x="14" y="3.5" width="6.5" height="6.5" rx="1.2" />
            <rect x="3.5" y="14" width="6.5" height="6.5" rx="1.2" />
            <path d="M14 14h2.5v2.5H14zM18 18h2.5v2.5H18zM18 14h2.5M14 18.5v2" />
          </svg>
        </button>
        <button id="about-open" class="icon" aria-label="このアプリについて">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5" />
            <path d="M12 11v5.5M12 7.6v.2" />
          </svg>
        </button>
      </nav>
    </header>

    <main>
      <section id="info" aria-live="polite">
        <p class="facts"><span id="formula"></span><span id="weight"></span></p>
        <h1 id="molecule-name"></h1>
        <p id="molecule-en"></p>
        <p id="blurb"></p>
        <ul id="legend" aria-label="含まれる元素"></ul>
      </section>

      <aside id="camera-panel" hidden>
        <video id="camera" autoplay muted playsinline></video>
        <canvas id="skeleton"></canvas>
        <p>つまんで回す<span>両手で広げる</span></p>
      </aside>

      <p id="status" role="status"></p>

      <section id="dock" aria-label="分子を選ぶ">
        <form id="search-form">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" />
            <path d="M16 16l4.5 4.5" />
          </svg>
          <input
            id="search"
            type="search"
            autocomplete="off"
            enterkeyhint="search"
            placeholder="分子の名前"
            aria-label="分子の名前"
          />
          <button id="voice" type="button" hidden aria-label="声で入力">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3" />
              <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" />
            </svg>
          </button>
        </form>
        <div id="chips"></div>
      </section>
    </main>

    <dialog id="panel">
      <button id="panel-close" class="icon" aria-label="閉じる">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
      <div id="panel-content"></div>
    </dialog>

    <noscript>JavaScriptを有効にすると表示されます。</noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
